[package]
name = "RealRDP"
version = "0.1.3"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "mstsc-compatible Remote Desktop (RDP) client with RemoteApp support, built on IronRDP"

# IronRDP git main: RAIL (RemoteApp) support is not on crates.io yet. Pinned rev, bump deliberately.
[dependencies]
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "0f9154d2128f8c65f4d51f6b7eb7cb1d66a12329", features = ["connector", "cliprdr", "input", "pdu", "client", "client-all"] }
ironrdp-viewer = { git = "https://github.com/Devolutions/IronRDP", rev = "0f9154d2128f8c65f4d51f6b7eb7cb1d66a12329" }
ironrdp-rail = { git = "https://github.com/Devolutions/IronRDP", rev = "0f9154d2128f8c65f4d51f6b7eb7cb1d66a12329" }
ironrdp-cfg = { git = "https://github.com/Devolutions/IronRDP", rev = "0f9154d2128f8c65f4d51f6b7eb7cb1d66a12329" }
ironrdp-propertyset = { git = "https://github.com/Devolutions/IronRDP", rev = "0f9154d2128f8c65f4d51f6b7eb7cb1d66a12329" }
ironrdp-rdpdr-native = { git = "https://github.com/Devolutions/IronRDP", rev = "0f9154d2128f8c65f4d51f6b7eb7cb1d66a12329" }
ironrdp-rdpfile = { git = "https://github.com/Devolutions/IronRDP", rev = "0f9154d2128f8c65f4d51f6b7eb7cb1d66a12329" }
softbuffer = "0.4"
x11rb = { version = "0.13", features = ["randr"] }
raw-window-handle = "0.6"
winit = { version = "0.30", features = ["rwh_06"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
eframe = "0.37"
rfd = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = "4"

[profile.release]
debug = 1

# RDP decoding and 40 MB framebuffers are unusable unoptimized; keep only our own code at opt-level 0.
[profile.dev.package."*"]
opt-level = 3

# Local IronRDP checkout with the 0x0429 connect-time Bandwidth Measure Stop fix (branch
# fix/connect-time-bw-stop-0429). Every git-sourced crate is redirected so there is one copy of each.
# Drop this section once upstream merges the fix and the rev above is bumped past it.
[patch."https://github.com/Devolutions/IronRDP"]
ironrdp = { path = "../IronRDP/crates/ironrdp" }
ironrdp-async = { path = "../IronRDP/crates/ironrdp-async" }
ironrdp-bulk = { path = "../IronRDP/crates/ironrdp-bulk" }
ironrdp-cfg = { path = "../IronRDP/crates/ironrdp-cfg" }
ironrdp-client = { path = "../IronRDP/crates/ironrdp-client" }
