ironrdp-pdu = { path = "../IronRDP/crates/ironrdp-pdu" }
ironrdp-propertyset = { path = "../IronRDP/crates/ironrdp-propertyset" }
ironrdp-rail = { path = "../IronRDP/crates/ironrdp-rail" }
ironrdp-rdcleanpath = { path = "../IronRDP/crates/ironrdp-rdcleanpath" }
ironrdp-rdpdr = { path = "../IronRDP/crates/ironrdp-rdpdr" }
