ironrdp-cliprdr-native = { path = "../IronRDP/crates/ironrdp-cliprdr-native" }
ironrdp-connector = { path = "../IronRDP/crates/ironrdp-connector" }
ironrdp-core = { path = "../IronRDP/crates/ironrdp-core" }
ironrdp-daemon = { path = "../IronRDP/crates/ironrdp-daemon" }
