<title>RealRDP pacman repository</title>
<h1>RealRDP pacman repository</h1>
<p>Add to <code>/etc/pacman.conf</code>:</p>
<pre>[realrdp]
SigLevel = Optional TrustAll
Server = https://jeremyvanwijngaarden.github.io/RealRDP/$arch</pre>
<p>Then: <code>sudo pacman -Sy realrdp</code></p>
<p>Source and PKGBUILD: <a href="https://github.com/JeremyvanWijngaarden/RealRDP">github.com/JeremyvanWijngaarden/RealRDP</a></p>
